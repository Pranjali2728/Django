<!DOCTYPE html>
<html>
<head>
    <title>Student Management Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f7fc;
        }

        .header{
            background: linear-gradient(90deg,#0d6efd,#6610f2);
            color:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:30px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .student-card{
            background:#198754;
            color:white;
        }

        .action-btn{
            width:100%;
            margin-top:10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <!-- Header -->
    <div class="header d-flex justify-content-between align-items-center">
        <h2>🎓 Student Management System</h2>

        <a href="{% url 'logout' %}" class="btn btn-light">
            Logout
        </a>
    </div>

    <div class="row">

        <!-- Total Students Card -->
        <div class="col-md-4">
            <div class="card student-card p-4 text-center">
                <h1>{{ total_students }}</h1>
                <h5>Total Students</h5>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="col-md-8">
            <div class="card p-4">
                <h3>Quick Actions</h3>

                <a href="{% url 'student_list' %}"
                   class="btn btn-primary action-btn">
                   📋 View Students
                </a>

                <a href="{% url 'add_student' %}"
                   class="btn btn-success action-btn">
                   ➕ Add Student
                </a>
            </div>
        </div>

    </div>

</div>


</body>
</html>

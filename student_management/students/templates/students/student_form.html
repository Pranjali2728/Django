<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body{
            background:#eef2ff;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.15);
        }

        .header{
            background:linear-gradient(90deg,#198754,#20c997);
            color:white;
            padding:20px;
            border-radius:12px;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="header">
                <h2>🎓 Add Student</h2>
            </div>

            <div class="card p-4">

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-success">
                        Save Student
                    </button>

                    <a href="{% url 'student_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
